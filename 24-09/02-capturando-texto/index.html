<!DOCTYPE html>
<!--
  EXERCÍCIO 2 — Capturando texto, e-mail e textarea
  Tópico: .value é sempre lido do mesmo jeito, para qualquer campo de texto

  O que fazer:
  1. Preencha nome, e-mail e a mensagem.
  2. Clique em "Enviar mensagem" e veja o resumo aparecer na página.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Exercício 2 — Capturando texto</title>
  <link rel="stylesheet" href="style.css" />
  <!-- defer: espera todo o HTML existir antes de rodar o script.js -->
  <script src="script.js" defer></script>
</head>
<body>

  <h1>Contato — Bikcraft</h1>

  <form id="form-contato">
    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required />

    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required />

    <label for="mensagem">Mensagem:</label>
    <textarea id="mensagem" name="mensagem" rows="3"></textarea>

    <button type="submit">Enviar mensagem</button>
  </form>

  <!-- <div>, e não <p>, porque vamos colocar HTML (com <strong> e <br>) aqui dentro -->
  <div id="resumo"></div>

</body>
</html>
