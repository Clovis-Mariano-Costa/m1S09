<!DOCTYPE html>
<!--
  EXERCÍCIO 2 — Validação com JavaScript
  Tópico: regra que o HTML não sabe validar sozinho (tamanho mínimo de senha) + if/return

  O que fazer:
  1. Digite uma senha com menos de 6 caracteres e clique em "Cadastrar".
  2. Veja a mensagem de erro aparecer — sem a página recarregar.
  3. Digite uma senha com 6 caracteres ou mais e envie de novo.
-->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Exercício 2 — validação com JavaScript</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>

  <h1>Cadastro de acesso</h1>

  <form id="form-cadastro">
    <!-- required cobre "não pode estar vazio"; a REGRA DE TAMANHO da senha é o JavaScript quem cuida -->
    <label for="email">E-mail:</label>
    <input type="email" id="email" name="email" required />

    <label for="senha">Senha (mínimo 6 caracteres):</label>
    <input type="password" id="senha" name="senha" required />

    <button type="submit">Cadastrar</button>
  </form>

  <p id="mensagem"></p>

</body>
</html>
